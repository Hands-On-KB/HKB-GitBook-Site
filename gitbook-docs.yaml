          key: space-1
          title: HKB Cybersecurity Reference Guide
          path: docs
          default: true
          content:
            directory: ./handsonkb-docs/docs
    - type: section-group
      key: section-group-3
      title: Pre-Req Info for Cyber
      icon: books
      children:
        - type: section
          key: section-11
          title: Operating System Fundamentals
          path: operating-system-fundamentals
          description: Pre-requisite knowledge on common operating systems to functionally perform a role in cybersecurity.
          icon: gears
          children:
            - type: space
              key: space-11
              title: Operating System Fundamentals
              path: os-fundamentals
              default: true
              content:
                directory: ./operating-system-fundamentals/os-fundamentals
        - type: section
          key: section-12
          title: Networking Fundamentals
          path: networking-fundamentals
          description: The pre-requisite knowledge needed on wired and wireless computer networking in order to functionally perform a role in cybersecurity.
