$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: HandsOnKB Docs
  structure:
    - type: section
      key: section-1
      title: HKB Cybersecurity Reference Guide
      path: handsonkb-docs
      description: Technical documents aggregated and written based on several different cybersecurity education sources to set a common view of best practices and techniques.
